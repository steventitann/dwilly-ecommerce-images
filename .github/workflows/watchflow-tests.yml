name: Watch image pipeline tests
on:
  push:
    paths: ['watchflow/**', '.github/workflows/watchflow-tests.yml']
  pull_request:
    paths: ['watchflow/**', '.github/workflows/watchflow-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r watchflow/requirements.txt
      - run: python -m unittest discover -s watchflow/tests -v
